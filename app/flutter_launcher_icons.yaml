# Generates the app icons from assets/brand (see tool/generate_brand_assets_test.dart):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ adaptive icon: the mark over a dark background, so the phone can crop it to any shape.
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  # Android 13 themed icons.
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
