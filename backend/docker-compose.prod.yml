# Production: the API image as built (no source mounted, no watch) + PostgreSQL.
#
#   cp .env.example .env      then fill in every empty value (see the comments in it)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Put the API behind HTTPS (a reverse proxy such as Caddy or Nginx): the app sends passwords
# and tokens to it.
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    # No published port: only the API can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      # One reverse proxy (HTTPS) in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Only reachable from the server itself: the reverse proxy forwards HTTPS traffic to it.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
